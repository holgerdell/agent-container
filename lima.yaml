minimumLimaVersion: 2.0.0

# Host has 24GiB / 14 cores. Leave ~10GiB + 6 cores for macOS:
# 20GiB starves the host (compressor + swap thrash) with little guest gain.
cpus: 8
memory: 14GiB

base:
  - template:_images/ubuntu-26.04

ssh:
  forwardAgent: true

user:
  passwordlessSudo: true

# Created by agent init at 120GiB by default (AGENT_LIMA_DISK_SIZE).
additionalDisks:
  - name: agent-home
    format: true
    fsType: ext4

provision:
  - mode: data
    file: guest-root/etc/bash.bashrc
    path: /etc/bash.bashrc
    permissions: 644

  - mode: data
    file: guest-root/etc/gitconfig
    path: /etc/gitconfig
    permissions: 644

  - mode: data
    file: guest-root/etc/gitignore
    path: /etc/gitignore
    permissions: 644

  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail

      guest_user='{{.User}}'
      guest_home='{{.Home}}'
      # Lima labels the disk "lima-<name>"; ext4 labels are limited to 16
      # characters, so the disk name must stay short or Lima reformats it
      # on every boot.
      persistent_home=/mnt/lima-agent-home
      fstab_entry="LABEL=lima-agent-home ${guest_home} ext4 defaults 0 2"

      # Never seed the home onto the root disk.
      mountpoint -q "${persistent_home}"
      if ! find "${persistent_home}" -mindepth 1 -not -name lost+found -print -quit | grep -q .; then
        cp -a "${guest_home}/." "${persistent_home}/"
      fi
      chown "${guest_user}:${guest_user}" "${persistent_home}"

      grep -Fqx "${fstab_entry}" /etc/fstab || printf '%s\n' "${fstab_entry}" >>/etc/fstab
      mountpoint -q "${guest_home}" || mount "${guest_home}"

  - mode: system
    file: install-system

  - mode: user
    file: install-tools
